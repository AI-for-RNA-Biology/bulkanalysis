[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "bulkanalysis"
version = "0.2.0"
description = "Bulk RNAseq data analysis"
authors = ["Lisa Fournier <lisa.fournier@unibe.ch>"]
readme = "README.md"
repository = "https://github.com/AI-for-RNA-Biology/bulkanalysis"
license = "GPL-3.0-only"
packages = [{include = "bulkanalysis"}] # editable mode

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = "^1.23.4"
pandas = "^1.5.1"
scikit-learn = "^1.1.3"
matplotlib = "^3.7.3"
scanpy = "^1.9.5"
scipy = "^1.11.2"
seaborn = "^0.11.2"
statannotations = "^0.5.0"
pyyaml = "^6.0"
rpy2 = {version = "^3.5.10", optional = true}
bioinfokit = {version = "^1.0.8", optional = true}
genomemanager = {git = "https://github.com/AI-for-RNA-Biology/genomemanager.git"}
kallistomanager = {git = "https://github.com/AI-for-RNA-Biology/kallistomanager.git"}

[tool.poetry.group.dev.dependencies]
bandit = "^1.7.4"
black = "^22.10.0"
coverage = "^6.5.0"
flake8 = "^5.0.4"
pre-commit = "^2.20.0"
pytest = "^7.2.0"
pytest-mock = "^3.10.0"
click = "^8.1.3"
reuse = "^2.1.0"

[tool.poetry.extras]
normalization = ["rpy2", "bioinfokit"]

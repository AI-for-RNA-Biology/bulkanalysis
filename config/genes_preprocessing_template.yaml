data_origin: kallisto_whole_transcriptome
df_counts_path: "/path/to/kallisto/output/folder"
gtf_file_no_focus: "/path/to/no_focus_annotation/annotation.gtf"

gene_names_path: "/path/to/gene_names/file.txt"
gene_info_path: "/path/to/gene_info/file.txt"
treatments:
  control: 
    - 'SRR14836658'
    - 'SRR14836659'
  FXR2_knockout': 
    - 'SRR14845602'
    - 'SRR14845603'

path_to_results: "/path/to/results/folder/genes_preprocessing"
figures_extension: "png"
pct_in_treatment: 0.75
quantile_threshold: 0.95
remove_outliers: True